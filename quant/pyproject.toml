[project]
name = "quant"
version = "0.1.0"
description = "Crypto quant trading system: data collection, backtest and live execution"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pytz>=2023.3",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
quant = "quant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quant"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer requires Option(...) in defaults
"quant/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
